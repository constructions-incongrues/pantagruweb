---
download_dir: /videos

# Options yt-dlp posees par le SERVEUR, non par l'appelant.
#
# Pourquoi ici et pas dans la requete n8n : l'API applique une liste blanche
# aux `ytdl_opts` recus (`ytdl_enable_whitelist: true`), et `cookiefile` n'en
# fait pas partie — un job qui la porte prend un
# `403 ForbiddenYTDLOption`. C'est delibere cote ytdl-server : laisser un
# appelant designer un fichier a lire ouvrirait une lecture arbitraire.
#
# Ces options-la echappent a la liste blanche parce qu'elles viennent de
# l'exploitant et non du reseau. C'est le mecanisme prevu pour ce cas.
#
# ATTENTION AU NOM DE LA CLE. L'option s'appelle `ytdl_default_opts` dans la
# documentation et dans la reponse de `/config`, mais sa clé YAML est
# IMBRIQUEE : `ytdl_opts` > `default_opts`
# (`config_option.py`: `config_key=('ytdl_opts', 'default_opts')`).
# Ecrite a plat, elle est ignoree en silence — le serveur demarre, sert, et
# `/config` renvoie `ytdl_default_opts: {}` sans le moindre avertissement.
#
# La fusion se fait cote API, dans `create_job` : le worker n'a pas besoin de
# ce fichier.
#
# Le fichier de cookies designe n'est pas dans ce depot : voir le commentaire
# du bind `cookies` dans compose.yaml.
ytdl_opts:
  default_opts:
    cookiefile: /cookies.txt
