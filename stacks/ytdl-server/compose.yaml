volumes:
  # PostgreSQL database files
  database:
  # Broker database files
  broker-data:

services:
  # REST API
  #
  # PAS DE ROUTE PUBLIQUE (decision D8 du change redeployer-ytdl-server-sur-gabelle).
  # Cette API n'a AUCUNE authentification : ni jeton, ni cle, ni controle d'acces
  # sur /jobs, /config, /meta, /health. Elle a ete exposee nue sur
  # ytdl.pantagruweb.club du 2025-10-31 au 2026-01-12.
  # Le port est publie sur l'hote et le pare-feu Hetzner Cloud ne l'ouvre qu'a
  # cartons (37.27.5.164/32). Ne PAS remettre de labels traefik ici sans avoir
  # d'abord donne une authentification a cette API.
  api:
    image: registry.gitlab.com/adralioh/ytdl-server/api:latest
    restart: on-failure
    depends_on:
      - database
      - broker
    environment: &ytdl-environment
      YTDL_DATABASE_URI: postgresql://postgres:password@database/ytdl
      YTDL_CELERY_BROKER_URL: amqp://broker
      # Needed if you're using a worker image that has yt-dlp
      YTDL_MODULE: yt_dlp
    ports:
      - "8000:8000"
    volumes:
      - ./ytdl-server.yml:/config/ytdl-server.yml:ro

  # Celery worker
  worker:
    image: registry.gitlab.com/adralioh/ytdl-server/worker:yt_dlp-ffmpeg
    restart: on-failure
    depends_on:
      # Le worker ne demarre QUE si la destination est prouvee (voir 'sidecar').
      sidecar:
        condition: service_completed_successfully
      database:
        condition: service_started
      broker:
        condition: service_started
    # Copy the environment from the 'api' service
    environment: *ytdl-environment
    volumes:
      - /mnt/remote/r2-musiquesincongrues-flarum/ytdl/videos:/videos
      - /mnt/volume-fsn1-1/ytdl-server/cache:/.cache

  # Garde de destination.
  #
  # Un bind Docker vers un chemin qui existe mais n'est PAS monte reussit
  # silencieusement : le worker ecrirait alors sur la racine de gabelle
  # (/dev/sda1, ~18 Go libres) en croyant ecrire dans R2, jusqu'a remplir le
  # systeme. C'est la panne qui a dure 294 jours, et ce service existe pour
  # qu'elle ne puisse pas recommencer.
  #
  # Il sort en erreur si la destination n'est pas la vraie, ce qui empeche le
  # worker de demarrer. Il ne couvre que le DEMARRAGE : un montage qui tombe en
  # cours de route n'est pas rattrape ici.
  sidecar:
    image: busybox:latest
    restart: "no"
    volumes:
      - /mnt/remote/r2-musiquesincongrues-flarum/ytdl/videos:/videos
    command:
      - /bin/sh
      - -c
      - |
        set -u
        D=/videos
        # 1. Le chemin existe.
        if [ ! -d "$$D" ]; then
          echo "FATAL: $$D absent" >&2; exit 1
        fi
        # 2. Le contenu distant est visible. Un repertoire local vide echoue ici :
        #    c'est le controle qui distingue "montee et vide" de "pas montee".
        if [ ! -d "$$D/musiques-incongrues.net" ]; then
          echo "FATAL: $$D ne porte pas le contenu distant attendu -- destination probablement non montee" >&2
          echo "       (ne PAS creer ce repertoire pour faire passer ce controle)" >&2
          exit 1
        fi
        # 3. L'ecriture est verifiee, pas supposee -- ecrite PUIS relue.
        W="$$D/.sidecar-witness-$$$$"
        if ! echo "ok" > "$$W" 2>/dev/null; then
          echo "FATAL: ecriture refusee sur $$D" >&2; exit 1
        fi
        if [ "$$(cat "$$W" 2>/dev/null)" != "ok" ]; then
          echo "FATAL: relecture incorrecte sur $$D" >&2; rm -f "$$W"; exit 1
        fi
        rm -f "$$W"
        # Informatif : le type de systeme de fichiers, sans valeur bloquante.
        grep " $$D " /proc/mounts || true
        echo "OK: destination montee, contenu distant visible, ecriture relue"

  # Database / Celery backend
  database:
    image: postgres:alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ytdl
    volumes:
      # Monte a la RACINE, pas sur /data. Depuis PostgreSQL 18 l'image range le
      # cluster dans un sous-repertoire par version majeure (18/docker), et
      # refuse de demarrer si elle trouve des donnees sous /var/lib/postgresql/data.
      # Le volume survivant porte deja cette disposition, plus un lien
      # symbolique `data -> .` pose le 2025-10-22 qui rend l'ancien chemin
      # toujours valide. Monter sur /data cassait donc le demarrage sans que le
      # compose du depot n'ait jamais decrit la realite.
      - database:/var/lib/postgresql

  # Celery broker.
  # You can also use a different type (such as Redis) as long as it's supported
  # by Celery
  broker:
    image: rabbitmq:alpine
    # Prevent RabbitMQ from creating a new database every time the container is
    # recreated
    hostname: ytdl-broker
    volumes:
      - broker-data:/var/lib/rabbitmq
